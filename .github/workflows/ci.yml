name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/shop_3
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # 1. Линтинг и тесты
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      RATE_LIMIT_AUTH_REQUESTS: 10000
      LOG_LEVEL: WARNING
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app tests

      - name: Run tests with pytest
        run: pytest

  # 2. Проверка сборки Docker-образов
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  # 3. Автодеплой на сервер (только при пуше в main или develop, или твою ветку)
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/feature/shop_3' # Измени на 'refs/heads/main', когда будешь готов к продакшену
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Yandex Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment..."
            cd /opt/shop-platform
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f
            echo "Deployment completed successfully!"